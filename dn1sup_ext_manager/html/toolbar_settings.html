<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кнопки панели DN1Sup</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1e2430; --muted: #6b7280;
    --line: #e3e6ea; --accent: #0e7490; --accent-soft: #e0f2fe;
    --danger: #b45309; --disabled-bg: #f0f1f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c2128; --panel: #242a33; --text: #e6e9ee; --muted: #9aa4b2;
      --line: #363d49; --accent: #38bdf8; --accent-soft: #10314a;
      --danger: #fbbf24; --disabled-bg: #2b323d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 16px 0;
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 12px; }
  #list { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px;
  }
  .item input { margin-top: 2px; flex: none; accent-color: var(--accent); }
  .item .t { font-weight: 600; }
  .item .d { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .item.off { opacity: .55; background: var(--disabled-bg); }
  .item .badge {
    display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px;
    font-size: 11px; font-weight: 500; background: var(--accent-soft); color: var(--accent);
  }
  .item.off .badge { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .opt {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; margin-top: 12px;
  }
  .opt input { margin-top: 2px; flex: none; accent-color: var(--accent); }
  .opt .t { font-weight: 600; }
  .opt .d { color: var(--muted); font-size: 12px; margin-top: 1px; }
  #note { color: var(--danger); font-size: 12px; margin: 10px 0 0; display: none; }
  #status { color: var(--muted); font-size: 12px; margin-left: 10px; }
  footer {
    position: sticky; bottom: 0; display: flex; align-items: center;
    padding: 10px 0 12px; margin-top: 12px; background: var(--bg);
  }
  button {
    font: inherit; padding: 6px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #0b1620; } }
  button:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <h1>Кнопки общей панели DN1Sup</h1>
  <p class="sub">Отметьте, какие кнопки показывать на панели «DN1Sup». Серым — расширения, которых нет среди установленных.</p>
  <div id="list"></div>
  <label class="opt">
    <input type="checkbox" id="cb-showold">
    <span>
      <span class="t">Показывать старые тулбары расширений</span>
      <div class="d">Отдельные панели «DN1Sup …» у каждого расширения. По умолчанию скрыты — их кнопки есть на общей панели.</div>
    </span>
  </label>
  <p id="note"></p>
  <footer>
    <button class="primary" id="btn-save">Сохранить</button>
    <button id="btn-close">Закрыть</button>
    <span id="status"></span>
  </footer>
<script>
'use strict';
const bridge = window.sketchup || { call_ruby: function () {} };
let buttons = [];

window.applyState = function (data) {
  buttons = (data && data.buttons) || [];
  const list = document.getElementById('list');
  list.innerHTML = '';
  buttons.forEach(function (b) {
    const row = document.createElement('label');
    row.className = 'item' + (b.available ? '' : ' off');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'cb-' + b.id;
    cb.checked = !!b.enabled;
    cb.disabled = !b.available;
    const text = document.createElement('span');
    const title = document.createElement('div');
    title.className = 't';
    title.textContent = b.title + (b.available ? '' : ' — не установлен');
    const desc = document.createElement('div');
    desc.className = 'd';
    desc.textContent = b.tooltip;
    text.appendChild(title);
    text.appendChild(desc);
    row.appendChild(cb);
    row.appendChild(text);
    list.appendChild(row);
  });
  document.getElementById('cb-showold').checked = !!(data && data.show_old);
};

window.applySaved = function (ok) {
  const el = document.getElementById('status');
  if (!ok) { el.textContent = 'Не удалось сохранить'; return; }
  const removed = buttons.filter(function (b) {
    const cb = document.getElementById('cb-' + b.id);
    return b.available && b.enabled && cb && !cb.checked;
  }).length;
  const note = document.getElementById('note');
  if (removed > 0) {
    note.textContent = 'Сохранено. Отключённые кнопки (' + removed + ') исчезнут после перезапуска SketchUp — удалять кнопки из панели SketchUp не позволяет.';
    note.style.display = 'block';
  }
  el.textContent = 'Сохранено ✓';
};

document.getElementById('btn-save').addEventListener('click', function () {
  const enabled = {};
  buttons.forEach(function (b) {
    const cb = document.getElementById('cb-' + b.id);
    enabled[b.id] = !!(cb && cb.checked);
  });
  bridge.call_ruby('save', JSON.stringify({
    buttons: enabled,
    show_old: document.getElementById('cb-showold').checked
  }));
});
document.getElementById('btn-close').addEventListener('click', function () {
  bridge.call_ruby('close');
});
window.addEventListener('load', function () {
  bridge.call_ruby('ready');
});
</script>
</body>
</html>
